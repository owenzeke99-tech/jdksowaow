<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DZ Hub Key</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0a0c10;
            --card-bg: rgba(18, 22, 31, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-cyan: #00f2fe;
            --accent-purple: #4facfe;
            --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --glow-color: rgba(0, 242, 254, 0.25);
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Canvas background particles */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 36px 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(0, 242, 254, 0.05);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            border-color: rgba(0, 242, 254, 0.2);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7),
                        0 0 40px rgba(0, 242, 254, 0.12);
        }

        .title {
            font-size: 2.3rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 0.92rem;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        /* Key Input Box */
        .key-box {
            background: rgba(10, 12, 16, 0.7);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }

        .key-box:focus-within {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px var(--glow-color);
        }

        .key-box i {
            color: var(--text-sub);
            font-size: 1.1rem;
        }

        .key-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            font-weight: 600;
        }

        /* Single Action Button */
        .btn-copy {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            background: var(--accent-gradient);
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
            margin-bottom: 20px;
        }

        .btn-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.45);
        }

        .btn-copy:active {
            transform: translateY(0);
        }

        /* Notification Toast */
        .toast {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none;
            margin-bottom: 20px;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success {
            background: rgba(46, 160, 67, 0.15);
            color: #3fb950;
            border: 1px solid rgba(46, 160, 67, 0.3);
        }

        .toast.error {
            background: rgba(248, 81, 73, 0.15);
            color: #f85149;
            border: 1px solid rgba(248, 81, 73, 0.3);
        }

        /* Footer Link */
        .divider {
            height: 1px;
            background: var(--card-border);
            margin: 20px 0;
        }

        .get-key-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent-cyan);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .get-key-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .footer-text {
            color: var(--text-sub);
            font-size: 0.8rem;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <!-- Canvas background particles -->
    <div id="particles-js"></div>

    <div class="container">
        <div class="card">
            
            <h1 class="title">DZ Hub Key</h1>
            <p class="subtitle">Extract and manage activation keys for your Roblox scripts quickly & securely.</p>

            <div class="key-box">
                <i class="fa-solid fa-key"></i>
                <input type="text" id="keyInput" class="key-input" value="DexkKeyTringBingLingHubRoblox" readonly>
            </div>

            <div id="toast" class="toast">
                <i id="toastIcon" class="fa-solid fa-circle-check"></i>
                <span id="toastText">Copied successfully!</span>
            </div>

            <button class="btn-copy" onclick="copyKey()">
                <i class="fa-regular fa-copy"></i> Copy Key
            </button>

            <div class="divider"></div>

            <p class="footer-text">Don't have a key or it's expired?</p>
            <a href="https://discord.gg/" target="_blank" class="get-key-link">
                Get Key on Discord Server <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </a>
        </div>
    </div>

    <!-- Scripts for Particles.js -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        /* Particles JS configuration */
        particlesJS("particles-js", {
            "particles": {
                "number": {
                    "value": 85,
                    "density": {
                        "enable": true,
                        "value_area": 800
                    }
                },
                "color": {
                    "value": ["#00f2fe", "#4facfe", "#ffffff"]
                },
                "shape": {
                    "type": "circle"
                },
                "opacity": {
                    "value": 0.5,
                    "random": true,
                    "anim": {
                        "enable": true,
                        "speed": 1,
                        "opacity_min": 0.1,
                        "sync": false
                    }
                },
                "size": {
                    "value": 3,
                    "random": true,
                    "anim": {
                        "enable": false
                    }
                },
                "line_linked": {
                    "enable": true,
                    "distance": 130,
                    "color": "#00f2fe",
                    "opacity": 0.25,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 2,
                    "direction": "none",
                    "random": false,
                    "straight": false,
                    "out_mode": "out",
                    "bounce": false,
                    "attract": {
                        "enable": true,
                        "rotateX": 600,
                        "rotateY": 1200
                    }
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": {
                        "enable": true,
                        "mode": "grab"
                    },
                    "onclick": {
                        "enable": true,
                        "mode": "push"
                    },
                    "resize": true
                },
                "modes": {
                    "grab": {
                        "distance": 160,
                        "line_linked": {
                            "opacity": 0.6
                        }
                    },
                    "push": {
                        "particles_nb": 4
                    }
                }
            },
            "retina_detect": true
        });

        /* Copy Key function */
        function copyKey() {
            const keyInput = document.getElementById("keyInput");
            keyInput.select();
            keyInput.setSelectionRange(0, 99999);

            navigator.clipboard.writeText(keyInput.value).then(() => {
                showToast("success", "fa-circle-check", "Key copied to clipboard!");
            }).catch(() => {
                showToast("error", "fa-circle-xmark", "Failed to copy, please try again!");
            });
        }

        /* Show Toast message function */
        let toastTimeout;
        function showToast(type, icon, text) {
            const toast = document.getElementById("toast");
            const toastIcon = document.getElementById("toastIcon");
            const toastText = document.getElementById("toastText");

            toast.className = `toast ${type} show`;
            toastIcon.className = `fa-solid ${icon}`;
            toastText.innerText = text;

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove("show");
            }, 3000);
        }
    </script>
</body>
</html>
